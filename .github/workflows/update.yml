name: Update transfer tracker

on:
  schedule:
    # Twice daily - injury news moves a lot during the week.
    - cron: "0 7,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Build tracker
        env:
          LEAGUE_ID: "6206"
          MY_TEAM: "Nottinghamburglars"
          TZ_NAME: "America/Chicago"
          LONG_HORIZON: "5"
        run: python build_transfers.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history_cache.json
          if git diff --staged --quiet; then
            echo "No change this run."
          else
            git commit -m "Update transfer tracker"
            git push
          fi
